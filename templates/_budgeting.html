{% from "_detailgrid.html" import grid with context %}
{% for g in grids %}
<div class="tablecard detailcard prodgrid">
  <div class="cardhead">
    <h3><a class="detlink" href="{{ url_for('details_page', order_id=o.id, line_item_id=g.item.id) }}">{{ g.ext_id or g.item.id }}</a>
      - {{ g.item.product or g.item.name }}{% if g.row.status %} - {{ g.row.status }}{% endif %}</h3>
    {% if not g.has_split %}
    <form method="post" class="inlineform"
      action="{{ url_for('details_build', order_id=o.id, line_item_id=g.item.id) }}">
      <button class="btn save" type="submit">Build split</button>
    </form>
    {% endif %}
  </div>
  {{ grid(g) }}
</div>
{% endfor %}
{% if grids %}
<div class="cardfoot gridsave">
  <button class="btn save" type="submit" form="splitform">Save split</button>
</div>
{% endif %}
