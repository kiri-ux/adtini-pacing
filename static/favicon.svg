<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- adtini Pacing — Vici brand: Atlas Blue field, Vici Gold mark.
       Two delivery bars against a target tick. Two, not three: at sixteen
       pixels a third bar is two pixels tall and the whole mark turns to
       mush. -->
  <rect width="64" height="64" rx="14" fill="#002D58"/>
  <!-- ahead of the tick, in gold -->
  <rect x="11" y="18" width="36" height="12" rx="6" fill="#F1B434"/>
  <!-- behind it, in parchment -->
  <rect x="11" y="35" width="22" height="12" rx="6" fill="#FDFBF7" opacity=".62"/>
  <!-- the target both are measured against -->
  <rect x="41" y="11" width="5" height="42" rx="2.5" fill="#FDFBF7"/>
</svg>
