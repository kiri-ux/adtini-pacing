# Blueprint for pacing.reporting.zone.
#
# Three pieces: the web service people use, a nightly cron job that pulls the
# S3 drops, and the Postgres instance they share. `render blueprint launch`
# or Render's "New > Blueprint" creates all three from this file.
services:
  - type: web
    name: adtini-pacing
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Applied before traffic moves to the new version, so the code and the
    # schema never disagree. The app itself never creates or alters tables.
    preDeployCommand: alembic upgrade head
    # ONE worker. The app costs ~110MB resident before it serves anything, so
    # two of them plus an ingest does not fit in Starter's 512MB and the
    # worker gets OOM-killed mid-request - which reads as a 502. Threads give
    # the concurrency instead; the work is IO-bound on the database.
    # The timeout covers a manual upload of a ~70MB drop.
    startCommand: gunicorn app:app --timeout 600 --worker-class gthread --workers 1 --threads 8 --max-requests 200 --max-requests-jitter 50
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: adtini-pacing-db
          property: connectionString
      - key: S3_BUCKET
        value: adtini-orders
      - key: S3_PREFIX
        value: orders/
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

  - type: cron
    name: adtini-pacing-ingest
    runtime: python
    plan: starter
    # 13:00 UTC, a little after the ~12:02 drop the sample file came from.
    schedule: "0 13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/ingest.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: adtini-pacing-db
          property: connectionString
      - key: S3_BUCKET
        value: adtini-orders
      - key: S3_PREFIX
        value: orders/
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: adtini-pacing-db
    plan: basic-256mb
    postgresMajorVersion: "16"
